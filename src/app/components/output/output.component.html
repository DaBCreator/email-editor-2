<div class="output-container">
  <div class="toolbar">
    <button tuiButton appearance="secondary" size="m" (click)="toggleEditMode()">
      {{ isEditMode ? 'Посмотреть' : 'Редактировать' }}
    </button>
  </div>

  <!-- РЕЖИМ ПРОСМОТРА -->
  <div *ngIf="!isEditMode" class="preview-mode">
    <div class="code-container">
      <button class="copy-btn" [cdkCopyToClipboard]="formattedCode" appearance="secondary" tuiIconButton icon="tuiIconCopyLarge" type="button"></button>
      <pre><code class="hljs" [innerHTML]="highlightedCode"></code></pre>
    </div>
  </div>

  <!-- РЕЖИМ РЕДАКТИРОВАНИЯ -->
  <div *ngIf="isEditMode" class="editor-mode">
    <div class="fake-editor-wrapper">
      <!-- Слой с цветным текстом -->
      <pre class="fake-editor-highlight" #codePre aria-hidden="true"><code class="hljs" [innerHTML]="highlightedCode"></code></pre>
      
      <!-- Прозрачный слой, куда мы печатаем -->
      <textarea 
        #codeTextarea
        class="fake-editor-input" 
        [value]="formattedCode" 
        (input)="onInput($event)"
        (scroll)="syncScroll()"
        spellcheck="false"
        wrap="off">
      </textarea>
    </div>
  </div>
</div>
