<div id="output-container" class="output-container">
  <div class="toolbar">
    <button tuiButton appearance="secondary" size="m" (click)="toggleEditMode()">
      {{ isEditMode ? 'Посмотреть' : 'Редактировать' }}
    </button>
  </div>

  <!-- РЕЖИМ ПРОСМОТРА -->
  <div *ngIf="!isEditMode" class="preview-mode">
    <div class="code-container">
      <!-- Блок с кнопками -->
      <div class="action-buttons">
        <!-- Предпросмотр -->
        <button class="action-btn"
                tuiIconButton 
                appearance="secondary" 
                size="m" 
                icon="tuiIconEye" 
                type="button"
                (click)="openPreview()">
        </button>

        <!-- Копирование -->
        <button class="action-btn"
                [cdkCopyToClipboard]="formattedCode" 
                appearance="secondary" 
                tuiIconButton 
                size="m"
                icon="tuiIconCopyLarge" 
                type="button">
        </button>
      </div>

      <!-- Скроллируемая область -->
      <div class="code-scroll-area">
        <pre><code class="hljs" [innerHTML]="highlightedCode"></code></pre>
      </div>
    </div>
  </div>

  <!-- РЕЖИМ РЕДАКТИРОВАНИЯ -->
  <div *ngIf="isEditMode" class="editor-mode">
    <div id="cm-editor-container"></div>
  </div>
</div>
