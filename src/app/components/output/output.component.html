<div class="output-container">
  <!-- Панель с кнопками -->
  <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <!-- Кнопка переключения режима -->
    <button tuiButton appearance="secondary" size="m" (click)="toggleEditMode()">
      {{ isEditMode ? 'Посмотреть' : 'Редактировать' }}
    </button>

    <!-- Кнопка копирования -->
    <button *ngIf="!isEditMode"
            class="float-right"
            [cdkCopyToClipboard]="formattedCode"
            appearance="secondary"
            tuiIconButton
            icon="tuiIconCopyLarge"
            type="button"></button>
  </div>

  <!-- Режим просмотра -->
  <div *ngIf="!isEditMode" class="preview-mode">
    <section>
      <pre>{{formattedCode}}</pre>
    </section>
  </div>

  <!-- Режим редактирования (CodeMirror) -->
  <div *ngIf="isEditMode" class="editor-mode" style="border: 1px solid #ccc; border-radius: 4px; height: 500px;">
    <div id="cm-editor-container"></div>
  </div>
</div>
