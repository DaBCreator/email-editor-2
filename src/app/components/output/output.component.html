<div class="output-container">
  <!-- Верхний тулбар ( кнопка Редактировать) -->
  <div class="toolbar">
    <button tuiButton appearance="secondary" size="m" (click)="toggleEditMode()">
      {{ isEditMode ? 'Показать результат' : 'Редактировать HTML' }}
    </button>
  </div>

  <!-- Режим просмотра -->
  <div *ngIf="!isEditMode" class="preview-mode">
    <!-- Подсвеченный код -->
    <pre><code class="hljs" [innerHTML]="highlightedCode"></code></pre>
    
    <!-- Кнопка копирования -->
    <div class="bottom-toolbar">
      <button class="float-right"
              [cdkCopyToClipboard]="formattedCode"
              appearance="secondary"
              tuiIconButton
              icon="tuiIconCopyLarge"
              type="button"></button>
    </div>
  </div>

  <!-- Режим редактирования (CodeMirror) -->
  <div *ngIf="isEditMode" class="editor-mode">
    <div id="cm-editor-container"></div>
  </div>
</div>
