<tui-tiles
           class="tiles"
           [debounce]="200"
           [(order)]="order"
           (orderChange)=onDrag($event)>
  <tui-tile
            *ngFor="let block of blocks; let index = index"
            class="tile"
            [height]="block.height"
            [style.order]="order.get(index)"
            [width]=3>
    <div class="content">
      {{block.name}}
      <ng-container *ngComponentOutlet="block.component; ndcDynamicInputs: block.inputs;
      ndcDynamicOutputs: block.outputs" />
      <tui-svg src="tuiIconDragLarge"
               tuiTileHandle
               class="handle"></tui-svg>
      <tui-svg class="delete" src="tuiIconX" (click)=removeComponent(index)></tui-svg>
    </div>

  </tui-tile>
</tui-tiles>

<!-- ПАЛИТРА БЛОКОВ (Сгруппированная) -->
<div class="groups-container">
  
  <div class="block-group" *ngFor="let group of componentGroups">
    
    <!-- Заголовок группы (клик для сворачивания) -->
    <div class="group-header" (click)="toggleGroup(group)">
      <span class="group-title">{{ group.name }}</span>
      <span class="group-icon" [class.open]="group.isOpen">▼</span>
    </div>

    <!-- Список кнопок внутри группы -->
    <div class="group-content" *ngIf="group.isOpen">
      <button *ngFor="let item of group.items" 
              (click)="addComponent(item)"
              appearance="primary"
              tuiButton
              type="button"
              class="block-btn">
        {{ item.name }}
      </button>
    </div>
    
  </div>
</div>
