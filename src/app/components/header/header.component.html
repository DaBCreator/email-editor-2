<!-- Твой заголовок -->
<div class="header-title-wrapper">
  <p class="text-3xl font-bold text-center m-0">Конструктор мейлов 2.0</p>
</div>

<!-- Кнопка "К коду" -->
<button 
  tuiButton 
  appearance="secondary" 
  size="m" 
  class="my-fixed-btn"
  (click)="scrollToEditor()">
  К коду
</button>

<button 
  class="theme-switch" 
  [class.dark]="isDarkMode"
  (click)="toggleTheme()"
  aria-label="Переключить тему">
  
  <div class="switch-track">
    <div class="switch-thumb"></div>
  </div>
</button>
